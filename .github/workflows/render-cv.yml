name: Render a CV
on:
  push:
    branches:
      - main
      - master
    paths:
      - "_data/cv.yml"
      - "_data/cv_zh.yml"
      - "requirements.txt"
      - "assets/rendercv/design.yaml"
      - "assets/rendercv/locale.yaml"
      - "assets/rendercv/locale_zh.yaml"
      - "assets/rendercv/settings.yaml"
  workflow_call:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  rendercv:
    name: RenderCV
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install RenderCV
        run: |
          pip install -r requirements.txt
      - name: RenderCV
        run: |
          rendercv_dir=$(find assets -maxdepth 1 -type d -name "rendercv")
          if [ -z "$rendercv_dir" ]; then
            echo "No RenderCV config directory found!"
            exit 1
          fi
          settings=$(find $rendercv_dir -maxdepth 1 -type f \( -name "settings.yaml" -o -name "settings.yml" \))
          if [ -z "$settings" ]; then
            echo "Missing RenderCV config file!"
            exit 1
          fi
          design=$(find $rendercv_dir -maxdepth 1 -type f \( -name "design.yaml" -o -name "design.yml" \))
          locale_en="$rendercv_dir/locale.yaml"
          locale_zh="$rendercv_dir/locale_zh.yaml"
          output_dir="$rendercv_dir/rendercv_output"
          english_dir="$RUNNER_TEMP/rendercv-english"
          chinese_dir="$RUNNER_TEMP/rendercv-chinese"
          mkdir -p "$output_dir"

          rendercv render _data/cv.yml --design "$design" --locale-catalog "$locale_en" --settings "$settings" --output-folder "$english_dir"
          english_pdf=$(find "$english_dir" -maxdepth 1 -type f -name "*.pdf" -print -quit)
          cp "$english_pdf" "$output_dir/Mio_CV_EN.pdf"

          rendercv render _data/cv_zh.yml --design "$design" --locale-catalog "$locale_zh" --settings "$settings" --output-folder "$chinese_dir"
          chinese_pdf=$(find "$chinese_dir" -maxdepth 1 -type f -name "*.pdf" -print -quit)
          cp "$chinese_pdf" "$output_dir/Mio_CV_ZH.pdf"
      - name: Upload rendercv_output as an artifact
        uses: actions/upload-artifact@v4
        with:
          name: RenderCV Output
          path: assets/rendercv/rendercv_output
      - name: Push the changes
        run: |
          git config --global user.name "${{ github.actor }}"
          git config --global user.email "${{ github.actor }}@users.noreply.github.com"
          git add -A
          git commit -m "chore: render the latest CV"
          git push
